name: Benchmark report

on:
  workflow_run:
    workflows: [Benchmarks]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: benchmark-report-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      # workflow_run uses the default branch. Never check out the PR's code here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const { postBenchmarkReport } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/benchmark-report.js`)
            await postBenchmarkReport({ github, context, core })
